<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Noot vir Noot</title>
<meta property="og:title" content="Noot vir Noot - scan a card, guess the year">
<meta property="og:description" content="100-song music timeline game. Scan a card and the song plays.">
<style>
:root{--bg:#14101f;--card:#221a35;--ink:#fff;--mute:#b9b0cc;--acc:#ff3d7f;--acc2:#ffb800}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 40px}
h1{font-size:22px;letter-spacing:.5px;margin-bottom:4px}h1 span{color:var(--acc)}
.sub{color:var(--mute);font-size:14px;margin-bottom:24px;text-align:center}
.card{width:100%;max-width:380px;background:var(--card);border-radius:24px;padding:28px 22px;text-align:center;box-shadow:0 10px 40px #0006}
.num{color:var(--mute);font-size:14px;letter-spacing:2px}
.stage{position:relative;width:200px;height:200px;margin:20px auto;overflow:hidden;border-radius:14px;isolation:isolate}.stage::after{content:"";position:absolute;inset:0;z-index:1;background:var(--card);transition:opacity .5s}.stage.shown::after{opacity:0}
.stage iframe,#yt{position:absolute;inset:0;width:200px;height:200px;border:0;border-radius:14px}
.disc{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#14101f 0 14%,var(--acc) 15% 18%,#000 19% 100%);box-shadow:0 0 0 6px #ffffff10;z-index:2;transition:opacity .5s}
.disc::after{content:"";position:absolute;inset:8px;border-radius:50%;background:repeating-radial-gradient(circle,#ffffff08 0 2px,transparent 2px 5px)}
.stage.shown .disc{opacity:0;pointer-events:none}
.spin{animation:spin 2.4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
button{font:inherit;border:0;cursor:pointer;border-radius:999px;font-weight:700}
.play{background:var(--acc);color:#fff;font-size:20px;padding:16px 36px;width:100%}
.play:disabled{opacity:.5}
.row{display:flex;gap:10px;margin-top:12px}
.ghost{flex:1;background:#ffffff14;color:var(--ink);padding:12px;font-size:15px}
.reveal{background:var(--acc2);color:#000;font-size:17px;padding:14px;width:100%;margin-top:18px}
.scanbtn{background:#fff;color:#14101f;font-size:18px;padding:15px;width:100%;margin-top:14px}
.bar{height:6px;background:#ffffff14;border-radius:6px;margin-top:16px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--acc)}
.status{color:var(--mute);font-size:13px;min-height:18px;margin-top:10px}
.ans{display:none;margin-top:18px;padding:18px;border-radius:16px;background:#ffffff0d}
.ans .y{font-size:56px;font-weight:800;color:var(--acc2);line-height:1}
.ans .a{font-size:18px;font-weight:700;margin-top:8px}.ans .t{font-style:italic;color:var(--mute);margin-top:4px}
.ans a{display:inline-block;margin-top:14px;color:#ff5c5c;font-size:14px;text-decoration:none}
.home p{color:var(--mute);font-size:15px;line-height:1.5;margin-bottom:14px;text-align:left}
.home input{width:100%;font:inherit;font-size:22px;text-align:center;padding:14px;border-radius:14px;border:0;background:#ffffff14;color:#fff;margin:6px 0 10px}
.or{color:var(--mute);font-size:13px;margin:18px 0 4px}
.scanner{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scanner .frame{position:relative;width:min(70vw,300px);aspect-ratio:1;border:4px solid #fff;border-radius:22px;box-shadow:0 0 0 100vmax #0008}
.scanner p{position:relative;margin-top:22px;font-size:16px;font-weight:600;text-align:center;padding:0 24px}
.scanner button{position:relative;margin-top:22px;background:#ffffff26;color:#fff;padding:12px 30px;font-size:16px}
</style>
</head>
<body>
<h1>NOOT <span>VIR</span> NOOT</h1>
<div class="sub">Listen - guess the year - build your timeline</div>
<div class="card">
  <div id="homeV" class="home">
    <p><b>How to play:</b> tap Scan, point the camera at a card and the song starts. Listen without peeking, place it on your timeline, then tap Reveal.</p>
    <button class="scanbtn" id="scanHome">&#128247;  Scan a card</button>
    <div class="or">or type a card number</div>
    <input id="cn" type="number" inputmode="numeric" min="1" placeholder="1 - 100">
    <button class="play" id="go">Go</button>
  </div>
  <div id="cardV" hidden>
    <div class="num" id="num"></div>
    <div class="stage" id="stage"><div id="yt"></div><div class="disc" id="disc"></div></div>
    <button class="play" id="pl" disabled>Loading...</button>
    <div class="row" id="seek"><button class="ghost" id="back">-10s</button><button class="ghost" id="skip">+15s</button></div>
    <div class="bar"><i id="pb"></i></div>
    <div class="status" id="st"></div>
    <button class="reveal" id="rv">Reveal answer</button>
    <div class="ans" id="ans"><div class="y" id="ay"></div><div class="a" id="aa"></div><div class="t" id="at"></div>
      <a target="_blank" rel="noopener" id="alink">Open on YouTube</a></div>
    <button class="scanbtn" id="scanNext">&#128247;  Scan next card</button>
  </div>
</div>
<div class="scanner" id="scanV" hidden>
  <video id="cam" playsinline muted></video>
  <div class="frame"></div>
  <p id="scanMsg">Point the camera at a card's QR code</p>
  <button id="cancel">Cancel</button>
</div>
<audio id="au" preload="auto" playsinline></audio>
<script>
const SONGS = [["Eddy Grant", "Gimme Hope Jo'anna", 1988], ["Cyndi Lauper", "Girls Just Want to Have Fun", 1983], ["Tyla", "Water", 2023], ["Yvonne Chaka Chaka", "Umqombothi", 1988], ["Sipho Hotstix Mabuse", "Burnout", 1984], ["Johnny Clegg & Savuka", "Asimbonanga", 1987], ["Bob Marley & The Wailers", "Could You Be Loved", 1980], ["Shakira ft. Freshlyground", "Waka Waka (This Time for Africa)", 2010], ["Bright Blue", "Weeping", 1987], ["The Rolling Stones", "(I Can't Get No) Satisfaction", 1965], ["Toto", "Africa", 1982], ["The Beatles", "Twist and Shout", 1963], ["Mark Ronson ft. Bruno Mars", "Uptown Funk", 2014], ["Hugh Masekela", "Grazing in the Grass", 1968], ["Survivor", "Eye of the Tiger", 1982], ["The Killers", "Mr. Brightside", 2003], ["The Police", "Every Breath You Take", 1983], ["Britney Spears", "...Baby One More Time", 1998], ["Juluka", "Scatterlings of Africa", 1982], ["Stimela", "Whispers in the Deep", 1986], ["OutKast", "Hey Ya!", 2003], ["The Beach Boys", "Good Vibrations", 1966], ["Gnarls Barkley", "Crazy", 2006], ["Oasis", "Wonderwall", 1995], ["Eagles", "Hotel California", 1976], ["Beyoncé", "Crazy in Love", 2003], ["Led Zeppelin", "Stairway to Heaven", 1971], ["Guns N' Roses", "Sweet Child O' Mine", 1987], ["Fleetwood Mac", "Dreams", 1977], ["Zahara", "Loliwe", 2011], ["The Weeknd", "Blinding Lights", 2019], ["Harry Styles", "As It Was", 2022], ["Dave Matthews Band", "Crash Into Me", 1996], ["Avicii", "Wake Me Up", 2013], ["PJ Powers & Ladysmith Black Mambazo", "World in Union", 1995], ["Uncle Waffles", "Tanzania", 2022], ["Billie Eilish", "bad guy", 2019], ["Mandoza", "Nkalakatha", 2000], ["Gotye", "Somebody That I Used to Know", 2011], ["Bon Jovi", "Livin' on a Prayer", 1986], ["Donna Summer", "Hot Stuff", 1979], ["Mango Groove", "Special Star", 1989], ["Madonna", "Like a Prayer", 1989], ["Daft Punk", "Get Lucky", 2013], ["Whitney Houston", "I Wanna Dance with Somebody", 1987], ["ABBA", "Dancing Queen", 1976], ["Ed Sheeran", "Shape of You", 2017], ["Aretha Franklin", "Respect", 1967], ["Adele", "Rolling in the Deep", 2010], ["Lucky Dube", "Prisoner", 1989], ["Backstreet Boys", "I Want It That Way", 1999], ["Taylor Swift", "Shake It Off", 2014], ["Pharrell Williams", "Happy", 2013], ["Michael Jackson", "Billie Jean", 1982], ["Seether ft. Amy Lee", "Broken", 2004], ["Coolio", "Gangsta's Paradise", 1995], ["R.E.M.", "Losing My Religion", 1991], ["Tones and I", "Dance Monkey", 2019], ["The Tokens", "The Lion Sleeps Tonight", 1961], ["Margaret Singana", "We Are Growing", 1986], ["Celine Dion", "My Heart Will Go On", 1997], ["Shakira", "Hips Don't Lie", 2006], ["Nirvana", "Smells Like Teen Spirit", 1991], ["TLC", "Waterfalls", 1995], ["Clout", "Substitute", 1978], ["Gloria Gaynor", "I Will Survive", 1978], ["Master KG ft. Nomcebo Zikode", "Jerusalema", 2019], ["The Cranberries", "Zombie", 1994], ["Bee Gees", "Stayin' Alive", 1977], ["Marvin Gaye", "I Heard It Through the Grapevine", 1968], ["TKZee", "Shibobo", 1998], ["Mafikizolo", "Khona", 2013], ["Focalistic", "Ke Star", 2020], ["Brenda Fassie", "Weekend Special", 1983], ["a-ha", "Take On Me", 1985], ["Manfred Mann's Earth Band", "Blinded by the Light", 1976], ["Miriam Makeba", "Pata Pata", 1967], ["Brenda Fassie", "Vulindlela", 1997], ["Coldplay", "Viva la Vida", 2008], ["Miley Cyrus", "Flowers", 2023], ["Brenda Fassie", "Too Late for Mama", 1989], ["Paul Simon", "You Can Call Me Al", 1986], ["Creedence Clearwater Revival", "Proud Mary", 1969], ["Rihanna", "Umbrella", 2007], ["Lady Gaga", "Poker Face", 2008], ["Stevie Wonder", "Superstition", 1972], ["The Beatles", "Hey Jude", 1968], ["Wham!", "Wake Me Up Before You Go-Go", 1984], ["Luis Fonsi ft. Daddy Yankee", "Despacito", 2017], ["Elvis Presley", "Suspicious Minds", 1969], ["Hugh Masekela", "Stimela", 1974], ["Eminem", "Lose Yourself", 2002], ["Queen", "Bohemian Rhapsody", 1975], ["Dua Lipa", "Levitating", 2020], ["Elton John", "Your Song", 1970], ["Simon & Garfunkel", "Mrs. Robinson", 1968], ["Hugh Masekela", "Bring Him Back Home", 1987], ["Amy Winehouse", "Rehab", 2006], ["Dire Straits", "Sultans of Swing", 1978], ["Spice Girls", "Wannabe", 1996]]; // [artist, title, year]
const YT_IDS = ["ZTGOAFXUEyI","gvLMhpzYic0","xynO0CdiE6Q","pSVKj6_pUIU","E72smOrpwaI","bvw8SOETkTI","zBqW6yKz8WA","Z_slTWayFK0","1POzJujs_oU","ySppDOLmiSQ","QAo_Ycocl1E","2RicaUqd9Hg","tYvFa2ARD24","b_V3mg_7xlE","S-LO6dctBms","m2zUrruKjDQ","-SaUrDhp034","91Niv2q4gvc","Q8xvaAHSsEk","ZGj_KskxJOw","ubk1skSE9OA","oMfjgQ8ptrE","vBtvhPM2GHc","rj5wZqReXQE","BciS5krYL80","5BnF0_LksYI","iXQUu5Dti4g","oMfMUfgjiLg","swJOIjjW69U","BaAPA6XAXrw","J7p4bzqLvCw","nujn6wbr-e8","zY7RwTPeYDA","2NiyrtYegso","-BRYMlWhh7E","uPxDY86UH-8","ZD6rXLXZOEI","DE4_sr3BU3w","xOazTYPrt64","YBdyc1WDlBQ","nYMeJSehCe4","Mgm7MuqCabo","ilottRbDnGY","4D7u5KF7SP8","6xzN8Nt0Pok","YkLLcIKhJ64","xTvyyoF_LZY","9iayJ8u4Qew","4ujBQOzs6Lw","B_mH5LM3hCk","LwkrXybZ1uo","sWMk8dwljFU","dJqxQzxLbHM","Kr4EQDVETuA","bwL1dY3XPGA","-5qqrMu_AZc","Efa6BAWPm9o","Hx4nWW9z0ig","N7MYqz7KgIs","esARyZz_xnw","Siz-xBfIqpg","nOj6d-HOw2w","ljUtuoFt-8c","A_iTphwVNYs","0eatGphKBA4","nXMPx4DDVWM","XZFlvAB1MlI","lSDfCdycdvk","z2qoihbzc3E","kAPj9oP4q_w","UhI4u8k7i_U","XoQvvBYvHcg","_KJurg2P-tk","P7Y4OLjN8UY","HzdD8kbDzZA","oWqBTAk0Qk8","SBH_u-vEK30","owVxCD4eOWk","ALsvdSA9tOU","BkSSOGNeWTM","KUHjI9prvOY","OMbfT3Wppjo","lfkFDUTJI0A","xXD5tltX9Pg","oG-4Uvhm4lI","ftdZ363R9kQ","mQER0A0ej0M","R14lGgHgVJM","FXovf5dsRTw","4Zt8yLQTNqM","lXY2TgDdcQ8","4wOLVrGHiIU","BSTsnWoslP4","OsfAnsMY21M","FT3D1Cu6g10","_C2vqI9FVwg","HUe0s3f1bng","t2TKqJ2FXGM","cF3OWCYLLVQ","tscL_I2v7pU"];
const $=id=>document.getElementById(id);
const au=$('au'), pl=$('pl'), st=$('st'), disc=$('disc'), pb=$('pb'), stage=$('stage'), ans=$('ans');
const SILENT='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
let player=null, ready=false, mode='yt', cur=0, pending=null, unlocked=false, unlocking=false, wantAuto=false, autoTimer=null;

function jsonp(url){
  return new Promise((res,rej)=>{
    const cb='cb'+Math.random().toString(36).slice(2), s=document.createElement('script');
    const t=setTimeout(()=>{cleanup();rej('timeout')},8000);
    function cleanup(){clearTimeout(t);delete window[cb];s.remove();}
    window[cb]=d=>{cleanup();res(d)};
    s.onerror=()=>{cleanup();rej('error')};
    s.src=url+(url.includes('?')?'&':'?')+(url.includes('deezer')?'output=jsonp&callback=':'callback=')+cb;
    document.head.appendChild(s);
  });
}
const norm=s=>s.toLowerCase().normalize('NFD').replace(/\p{M}/gu,'').replace(/\(.*?\)/g,'').replace(/[^a-z0-9]/g,'');
function pick(list, title, getT, getP){
  const want=norm(title);
  const ok=list.filter(x=>getP(x));
  return ok.find(x=>norm(getT(x)).startsWith(want)||want.startsWith(norm(getT(x)))) || ok.find(x=>norm(getT(x)).includes(want)) || null;
}
async function findPreview(artist, title){
  const a=artist.split(/ ft\. | & /)[0];
  const core=title.replace(/\(.*?\)/g,'').trim();
  const tries=[
    ()=>jsonp('https://api.deezer.com/search?limit=10&q='+encodeURIComponent(`artist:"${a}" track:"${core}"`)).then(d=>pick(d.data||[],core,x=>x.title,x=>x.preview)?.preview),
    ()=>jsonp('https://api.deezer.com/search?limit=15&q='+encodeURIComponent(`${a} ${core}`)).then(d=>pick(d.data||[],core,x=>x.title,x=>x.preview)?.preview),
    ()=>jsonp('https://itunes.apple.com/search?entity=song&limit=15&term='+encodeURIComponent(`${a} ${core}`)).then(d=>pick(d.results||[],core,x=>x.trackName,x=>x.previewUrl)?.previewUrl),
  ];
  for(const f of tries){try{const u=await f(); if(u) return u;}catch(e){}}
  return null;
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}

const spin=on=>disc.classList.toggle('spin',on);
const setBtn=s=>pl.textContent=s;
const PLAY='▶  Play', PAUSE='❚❚  Pause', AGAIN='↻  Play again';

// ---------- YouTube player (one player for the whole session) ----------
window.onYouTubeIframeAPIReady=()=>{
  player=new YT.Player('yt',{width:200,height:200,
    playerVars:{playsinline:1,controls:0,disablekb:1,fs:0,rel:0,iv_load_policy:3,modestbranding:1},
    events:{
      onReady:()=>{ready=true; if(pending){const p=pending;pending=null;startCard(p.n,p.auto);} },
      onStateChange:e=>{
        if(unlocking){ if(e.data===1){player.pauseVideo();player.unMute();unlocking=false;} return; }
        if(!cur||mode!=='yt') return;
        if(e.data===1){spin(true);setBtn(PAUSE);st.textContent='Full song - no peeking!';clearTimeout(autoTimer);}
        else if(e.data===2){spin(false);setBtn(PLAY);}
        else if(e.data===0){spin(false);setBtn(AGAIN);}
      },
      onError:()=>{ if(unlocking){unlocking=false;return;} if(cur) useAudio(); }
    }});
};
loadScript('https://www.youtube.com/iframe_api').catch(()=>{});
setTimeout(()=>{ if(!ready && pending){const p=pending;pending=null;cur=p.n;useAudio();} },12000);

// Called from a tap: lets later songs start by themselves
function unlock(){
  if(unlocked) return; unlocked=true;
  try{ au.src=SILENT; au.play().then(()=>au.pause()).catch(()=>{}); }catch(e){}
  if(ready && !cur){ unlocking=true; player.mute(); player.loadVideoById(YT_IDS[0]); }
}

function useAudio(){
  mode='audio'; clearTimeout(autoTimer);
  try{player&&player.stopVideo();}catch(e){}
  $('seek').hidden=true; setBtn('Loading...'); pl.disabled=true;
  const n=cur, [artist,title]=SONGS[n-1];
  findPreview(artist,title).then(u=>{
    if(n!==cur) return;
    if(!u){setBtn('No song found');st.textContent='Tap Reveal and use the YouTube link';return;}
    au.src=u; pl.disabled=false; setBtn(PLAY); st.textContent='30-second clip - no peeking!';
    if(wantAuto) au.play().catch(()=>{st.textContent='Tap Play to start';});
  });
}
au.onplay=()=>{ if(mode==='audio'){spin(true);setBtn(PAUSE);} };
au.onpause=()=>{ if(mode==='audio'){spin(false);setBtn(PLAY);} };
au.onended=()=>{ if(mode==='audio'){spin(false);setBtn(AGAIN);} };

function showCard(n, auto){
  cur=n; wantAuto=auto; mode='yt';
  try{history.replaceState(null,'','?c='+n);}catch(e){}
  document.title='Noot vir Noot - card '+n;
  const [artist,title,year]=SONGS[n-1], vid=YT_IDS[n-1];
  $('homeV').hidden=true; $('cardV').hidden=false;
  $('num').textContent='CARD #'+String(n).padStart(3,'0');
  $('ay').textContent=year; $('aa').textContent=artist; $('at').textContent=title;
  $('alink').href='https://www.youtube.com/watch?v='+vid;
  ans.style.display='none'; $('rv').style.display=''; stage.classList.remove('shown');
  $('seek').hidden=false; spin(false); pb.style.width='0';
  au.pause(); au.removeAttribute('src');
  pl.disabled=true; setBtn('Loading...'); st.textContent='';
  if(!ready){ pending={n,auto}; return; }
  startCard(n,auto);
}
function startCard(n,auto){
  if(n!==cur) return;
  unlocking=false; try{player.unMute();}catch(e){}
  const vid=YT_IDS[n-1];
  pl.disabled=false; setBtn(PLAY); st.textContent='Full song - no peeking!';
  clearTimeout(autoTimer);
  if(auto){
    player.loadVideoById(vid);
    autoTimer=setTimeout(()=>{ if(mode==='yt' && player.getPlayerState()!==1){ st.textContent='Tap Play to start'; setBtn(PLAY); spin(false);} },3500);
  } else player.cueVideoById(vid);
}

pl.onclick=()=>{
  unlock();
  if(mode==='yt'&&player&&ready){
    const s=player.getPlayerState();
    if(s===1) player.pauseVideo(); else { if(s===0) player.seekTo(0,true); player.playVideo(); }
  } else if(mode==='audio' && au.src){
    if(au.paused) au.play().catch(()=>st.textContent='Tap play again'); else au.pause();
  }
};
$('skip').onclick=()=>{if(player&&ready) player.seekTo(player.getCurrentTime()+15,true);};
$('back').onclick=()=>{if(player&&ready) player.seekTo(Math.max(0,player.getCurrentTime()-10),true);};
setInterval(()=>{
  if(!cur) return;
  let c=0,d=0;
  if(mode==='yt'&&player&&ready&&player.getCurrentTime){c=player.getCurrentTime()||0;d=player.getDuration()||0;}
  else {c=au.currentTime||0;d=au.duration||0;}
  pb.style.width=(d?c/d*100:0)+'%';
},500);
$('rv').onclick=()=>{ans.style.display='block';$('rv').style.display='none';stage.classList.add('shown');};
$('go').onclick=()=>{unlock(); const v=parseInt($('cn').value,10); if(v>=1&&v<=SONGS.length) showCard(v,true);};
$('cn').onkeydown=e=>{if(e.key==='Enter')$('go').click();};

// ---------- QR scanner ----------
let stream=null, scanning=false, detector=null, cvs=null;
async function openScanner(){
  unlock();
  try{player&&ready&&player.pauseVideo();}catch(e){} au.pause();
  $('scanV').hidden=false; $('scanMsg').textContent="Point the camera at a card's QR code";
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  }catch(e){ $('scanMsg').textContent='Camera not available. Allow camera access for this page, or tap Cancel and type the card number.'; return; }
  const v=$('cam'); v.srcObject=stream; try{await v.play();}catch(e){}
  if(!detector && 'BarcodeDetector' in window){ try{ detector=new BarcodeDetector({formats:['qr_code']}); }catch(e){ detector=null; } }
  if(!detector && !window.jsQR){ try{ await loadScript('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'); }catch(e){} }
  scanning=true; scanLoop();
}
function closeScanner(){
  scanning=false;
  if(stream){stream.getTracks().forEach(t=>t.stop()); stream=null;}
  $('cam').srcObject=null; $('scanV').hidden=true;
}
function cardFrom(text){
  let n=NaN;
  try{ n=parseInt(new URL(text, location.href).searchParams.get('c'),10); }catch(e){}
  if(isNaN(n)) n=parseInt(text,10);
  return (n>=1&&n<=SONGS.length)?n:0;
}
async function scanLoop(){
  if(!scanning) return;
  const v=$('cam'); let text=null;
  if(v.readyState>=2){
    try{
      if(detector){ const codes=await detector.detect(v); if(codes.length) text=codes[0].rawValue; }
      else if(window.jsQR){
        cvs=cvs||document.createElement('canvas');
        const w=v.videoWidth, h=v.videoHeight, s=Math.min(1, 640/Math.max(w,h));
        cvs.width=Math.round(w*s); cvs.height=Math.round(h*s);
        const ctx=cvs.getContext('2d',{willReadFrequently:true}); ctx.drawImage(v,0,0,cvs.width,cvs.height);
        const r=jsQR(ctx.getImageData(0,0,cvs.width,cvs.height).data,cvs.width,cvs.height,{inversionAttempts:'dontInvert'});
        if(r) text=r.data;
      }
    }catch(e){}
  }
  if(text){ const n=cardFrom(text); if(n){ closeScanner(); showCard(n,true); return; } else $('scanMsg').textContent='That is not a Noot vir Noot card'; }
  setTimeout(scanLoop,150);
}
$('scanHome').onclick=openScanner;
$('scanNext').onclick=openScanner;
$('cancel').onclick=closeScanner;

// ---------- start ----------
const start=parseInt(new URLSearchParams(location.search).get('c')||location.hash.slice(1),10);
if(start>=1&&start<=SONGS.length) showCard(start,true);
</script>
</body>
</html>
