<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Noot vir Noot</title>
<meta property="og:title" content="Noot vir Noot - scan a card, guess the year">
<meta property="og:description" content="100-song music timeline game. Scan a card with your phone camera and press play.">
<style>
:root{--bg:#14101f;--card:#221a35;--ink:#fff;--mute:#b9b0cc;--acc:#ff3d7f;--acc2:#ffb800}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 40px}
h1{font-size:22px;letter-spacing:.5px;margin-bottom:4px}h1 span{color:var(--acc)}
.sub{color:var(--mute);font-size:14px;margin-bottom:24px;text-align:center}
.card{width:100%;max-width:380px;background:var(--card);border-radius:24px;padding:28px 22px;text-align:center;box-shadow:0 10px 40px #0006}
.num{color:var(--mute);font-size:14px;letter-spacing:2px}
.stage{position:relative;width:200px;height:200px;margin:20px auto;overflow:hidden;border-radius:14px}
.stage iframe,#yt{position:absolute;inset:0;width:200px;height:200px;border:0;border-radius:14px}
.disc{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#14101f 0 14%,var(--acc) 15% 18%,#000 19% 100%);box-shadow:0 0 0 6px #ffffff10,0 0 0 80px var(--card);transition:opacity .5s}
.disc::after{content:"";position:absolute;inset:8px;border-radius:50%;background:repeating-radial-gradient(circle,#ffffff08 0 2px,transparent 2px 5px)}
.stage.shown .disc{opacity:0;pointer-events:none}
.spin{animation:spin 2.4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
button{font:inherit;border:0;cursor:pointer;border-radius:999px;font-weight:700}
.play{background:var(--acc);color:#fff;font-size:20px;padding:16px 36px;width:100%}
.play:disabled{opacity:.5}
.row{display:flex;gap:10px;margin-top:12px}
.ghost{flex:1;background:#ffffff14;color:var(--ink);padding:12px;font-size:15px}
.reveal{background:var(--acc2);color:#000;font-size:17px;padding:14px;width:100%;margin-top:18px}
.bar{height:6px;background:#ffffff14;border-radius:6px;margin-top:16px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--acc)}
.status{color:var(--mute);font-size:13px;min-height:18px;margin-top:10px}
.ans{display:none;margin-top:18px;padding:18px;border-radius:16px;background:#ffffff0d}
.ans .y{font-size:56px;font-weight:800;color:var(--acc2);line-height:1}
.ans .a{font-size:18px;font-weight:700;margin-top:8px}.ans .t{font-style:italic;color:var(--mute);margin-top:4px}
.ans a{display:inline-block;margin-top:14px;color:#ff5c5c;font-size:14px;text-decoration:none}
.home p{color:var(--mute);font-size:15px;line-height:1.5;margin-bottom:14px;text-align:left}
.home input{width:100%;font:inherit;font-size:22px;text-align:center;padding:14px;border-radius:14px;border:0;background:#ffffff14;color:#fff;margin-bottom:12px}
</style>
</head>
<body>
<h1>NOOT <span>VIR</span> NOOT</h1>
<div class="sub">Listen - guess the year - build your timeline</div>
<div class="card" id="app"></div>
<audio id="au" preload="auto" playsinline></audio>
<script>
const SONGS = [["Eddy Grant", "Gimme Hope Jo'anna", 1988], ["Cyndi Lauper", "Girls Just Want to Have Fun", 1983], ["Tyla", "Water", 2023], ["Yvonne Chaka Chaka", "Umqombothi", 1988], ["Sipho Hotstix Mabuse", "Burnout", 1984], ["Johnny Clegg & Savuka", "Asimbonanga", 1987], ["Bob Marley & The Wailers", "Could You Be Loved", 1980], ["Shakira ft. Freshlyground", "Waka Waka (This Time for Africa)", 2010], ["Bright Blue", "Weeping", 1987], ["The Rolling Stones", "(I Can't Get No) Satisfaction", 1965], ["Toto", "Africa", 1982], ["The Beatles", "Twist and Shout", 1963], ["Mark Ronson ft. Bruno Mars", "Uptown Funk", 2014], ["Hugh Masekela", "Grazing in the Grass", 1968], ["Survivor", "Eye of the Tiger", 1982], ["The Killers", "Mr. Brightside", 2003], ["The Police", "Every Breath You Take", 1983], ["Britney Spears", "...Baby One More Time", 1998], ["Juluka", "Scatterlings of Africa", 1982], ["Stimela", "Whispers in the Deep", 1986], ["OutKast", "Hey Ya!", 2003], ["The Beach Boys", "Good Vibrations", 1966], ["Gnarls Barkley", "Crazy", 2006], ["Oasis", "Wonderwall", 1995], ["Eagles", "Hotel California", 1976], ["Beyoncé", "Crazy in Love", 2003], ["Led Zeppelin", "Stairway to Heaven", 1971], ["Guns N' Roses", "Sweet Child O' Mine", 1987], ["Fleetwood Mac", "Dreams", 1977], ["Zahara", "Loliwe", 2011], ["The Weeknd", "Blinding Lights", 2019], ["Harry Styles", "As It Was", 2022], ["Dave Matthews Band", "Crash Into Me", 1996], ["Avicii", "Wake Me Up", 2013], ["PJ Powers & Ladysmith Black Mambazo", "World in Union", 1995], ["Uncle Waffles", "Tanzania", 2022], ["Billie Eilish", "bad guy", 2019], ["Mandoza", "Nkalakatha", 2000], ["Gotye", "Somebody That I Used to Know", 2011], ["Bon Jovi", "Livin' on a Prayer", 1986], ["Donna Summer", "Hot Stuff", 1979], ["Mango Groove", "Special Star", 1989], ["Madonna", "Like a Prayer", 1989], ["Daft Punk", "Get Lucky", 2013], ["Whitney Houston", "I Wanna Dance with Somebody", 1987], ["ABBA", "Dancing Queen", 1976], ["Ed Sheeran", "Shape of You", 2017], ["Aretha Franklin", "Respect", 1967], ["Adele", "Rolling in the Deep", 2010], ["Lucky Dube", "Prisoner", 1989], ["Backstreet Boys", "I Want It That Way", 1999], ["Taylor Swift", "Shake It Off", 2014], ["Pharrell Williams", "Happy", 2013], ["Michael Jackson", "Billie Jean", 1982], ["Seether ft. Amy Lee", "Broken", 2004], ["Coolio", "Gangsta's Paradise", 1995], ["R.E.M.", "Losing My Religion", 1991], ["Tones and I", "Dance Monkey", 2019], ["The Tokens", "The Lion Sleeps Tonight", 1961], ["Margaret Singana", "We Are Growing", 1986], ["Celine Dion", "My Heart Will Go On", 1997], ["Shakira", "Hips Don't Lie", 2006], ["Nirvana", "Smells Like Teen Spirit", 1991], ["TLC", "Waterfalls", 1995], ["Clout", "Substitute", 1978], ["Gloria Gaynor", "I Will Survive", 1978], ["Master KG ft. Nomcebo Zikode", "Jerusalema", 2019], ["The Cranberries", "Zombie", 1994], ["Bee Gees", "Stayin' Alive", 1977], ["Marvin Gaye", "I Heard It Through the Grapevine", 1968], ["TKZee", "Shibobo", 1998], ["Mafikizolo", "Khona", 2013], ["Focalistic", "Ke Star", 2020], ["Brenda Fassie", "Weekend Special", 1983], ["a-ha", "Take On Me", 1985], ["Manfred Mann's Earth Band", "Blinded by the Light", 1976], ["Miriam Makeba", "Pata Pata", 1967], ["Brenda Fassie", "Vulindlela", 1997], ["Coldplay", "Viva la Vida", 2008], ["Miley Cyrus", "Flowers", 2023], ["Brenda Fassie", "Too Late for Mama", 1989], ["Paul Simon", "You Can Call Me Al", 1986], ["Creedence Clearwater Revival", "Proud Mary", 1969], ["Rihanna", "Umbrella", 2007], ["Lady Gaga", "Poker Face", 2008], ["Stevie Wonder", "Superstition", 1972], ["The Beatles", "Hey Jude", 1968], ["Wham!", "Wake Me Up Before You Go-Go", 1984], ["Luis Fonsi ft. Daddy Yankee", "Despacito", 2017], ["Elvis Presley", "Suspicious Minds", 1969], ["Hugh Masekela", "Stimela", 1974], ["Eminem", "Lose Yourself", 2002], ["Queen", "Bohemian Rhapsody", 1975], ["Dua Lipa", "Levitating", 2020], ["Elton John", "Your Song", 1970], ["Simon & Garfunkel", "Mrs. Robinson", 1968], ["Hugh Masekela", "Bring Him Back Home", 1987], ["Amy Winehouse", "Rehab", 2006], ["Dire Straits", "Sultans of Swing", 1978], ["Spice Girls", "Wannabe", 1996]]; // [artist, title, year]
const YT_IDS = ["R-ZplG81oZg","PIb6AZdTr-A","wlmUnWLaeog","LUrPy6wG-i4","zLFlcXk0ec0","UJujyzA2Q1E","1ti2YCFgCoI","pRpeEdMmmQ0","qdyu_jcLYW8","nrIPxlFzDi0","FTQbiNvZqaY","2RicaUqd9Hg","OPf0YbXqDm0","qxXZF60EPdM","btPJPFnesV4","gGdGFtwCNBE","OMOGaugKpzs","fEfvTTJNeAY","2X-o7Kfqbuw","Qy9QPjUkvvM","PWgvGjAhvIw","apBWI6xrbLY","-N4jf6rtyuw","bx1Bh8ZvH84","dLl4PZtxia8","ViwtNLUqkMY","QkF3oxziUI4","1w7OgIMMRc4","5oWyMakvQew","BaAPA6XAXrw","fHI8X4OXluQ","H5v3kku4y6Q","k7in-9E3ImQ","5y_KJAg8bHI","-BRYMlWhh7E","zi7kX1jkRuA","DyDfgMOUjCI","b28vJvntyUM","8UVNT4wvIGY","lDK9QqIzhwk","tJxOXzE5A8w","N7FN6XflbL8","79fzeNUqQbQ","5NV6Rdv1a3I","id2-K3daNRQ","xFrGuyw1V8s","JGwWNGJdvx8","A134hShx_gw","rYEDA3JcQqw","RsKAaLVNOLw","4fndeDfaWCg","nfWlot6h_JM","ZbZSe6N_BXs","Zi_XLOBDo_Y","XSHgu7mJ2UM","7DXlY8LhWnI","xwtdhWltSIg","q0hyYWKXF0Q","OQlByoPdG6c","Rwrm-zeeZTE","9bFHsd3o1w0","DUT5rEU6pqM","hTWKbfoikeg","8WEtxJ4-sh4","5fgA_yNCeq4","6dYWe1c3OyU","fCZVL_8D048","6Ejga4kJUts","fNFzfwLM72c","cXWHpbpNdHE","9ZpiHSwC_pM","XoQvvBYvHcg","a9_da2P5JjQ","VjQD--fgCFM","djV11Xbc914","oWqBTAk0Qk8","JBJVVhn7iuo","JB-OGtSEc64","dvgZkm1xWPE","G7KNmW9a75Y","iXpxYWRPq6c","uq-gYOrU8bA","5hid10EgMXE","CvBfHwUxHIk","bESGLojNYSo","ftdZ363R9kQ","A_MjCqQoLLA","pIgZ7gMze7A","kJQP7kiw5Fk","RxOBOhRECoo","n4Bb7p9gggc","xFYQQPAOz7Y","fJ9rUzIMcZQ","TUVcZfQe-Kw","FT3D1Cu6g10","9C1BCAgu2I8","HUe0s3f1bng","KUmZp8pR1uc","h0ffIJ7ZO4U","gJLIiF15wjQ"];
const app = document.getElementById('app'), au = document.getElementById('au');
const n = parseInt(new URLSearchParams(location.search).get('c') || location.hash.slice(1), 10);

function home(){
  app.className='card home';
  app.innerHTML = `<p><b>How to play:</b> point your phone camera at a card's QR code and open the link. Press play, listen without peeking, and place the song on your timeline. Then tap Reveal.</p>
  <p>Or type a card number:</p>
  <input id="cn" type="number" inputmode="numeric" min="1" max="${SONGS.length}" placeholder="1 - ${SONGS.length}">
  <button class="play" id="go">Go</button>`;
  const go=()=>{const v=parseInt(document.getElementById('cn').value,10); if(v>=1&&v<=SONGS.length) location.search='?c='+v;};
  document.getElementById('go').onclick=go;
  document.getElementById('cn').onkeydown=e=>{if(e.key==='Enter')go();};
}

function jsonp(url){
  return new Promise((res,rej)=>{
    const cb='cb'+Math.random().toString(36).slice(2), s=document.createElement('script');
    const t=setTimeout(()=>{cleanup();rej('timeout')},8000);
    function cleanup(){clearTimeout(t);delete window[cb];s.remove();}
    window[cb]=d=>{cleanup();res(d)};
    s.onerror=()=>{cleanup();rej('error')};
    s.src=url+(url.includes('?')?'&':'?')+(url.includes('deezer')?'output=jsonp&callback=':'callback=')+cb;
    document.head.appendChild(s);
  });
}
const norm=s=>s.toLowerCase().normalize('NFD').replace(/\p{M}/gu,'').replace(/\(.*?\)/g,'').replace(/[^a-z0-9]/g,'');
function pick(list, title, getT, getP){
  const want=norm(title);
  const ok=list.filter(x=>getP(x));
  return ok.find(x=>norm(getT(x)).startsWith(want)||want.startsWith(norm(getT(x)))) || ok.find(x=>norm(getT(x)).includes(want)) || null;
}
async function findPreview(artist, title){
  const a=artist.split(/ ft\. | & /)[0];
  const core=title.replace(/\(.*?\)/g,'').trim();
  const tries=[
    ()=>jsonp('https://api.deezer.com/search?limit=10&q='+encodeURIComponent(`artist:"${a}" track:"${core}"`)).then(d=>pick(d.data||[],core,x=>x.title,x=>x.preview)?.preview),
    ()=>jsonp('https://api.deezer.com/search?limit=15&q='+encodeURIComponent(`${a} ${core}`)).then(d=>pick(d.data||[],core,x=>x.title,x=>x.preview)?.preview),
    ()=>jsonp('https://itunes.apple.com/search?entity=song&limit=15&term='+encodeURIComponent(`${a} ${core}`)).then(d=>pick(d.results||[],core,x=>x.trackName,x=>x.previewUrl)?.previewUrl),
  ];
  for(const f of tries){try{const u=await f(); if(u) return u;}catch(e){}}
  return null;
}
function loadYT(){
  return new Promise(res=>{
    if(window.YT&&YT.Player) return res();
    window.onYouTubeIframeAPIReady=res;
    const s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api'; document.head.appendChild(s);
  });
}

function game(i){
  const [artist,title,year]=SONGS[i-1], vid=YT_IDS[i-1];
  document.title='Noot vir Noot - card '+i;
  app.innerHTML=`<div class="num">CARD #${String(i).padStart(3,'0')}</div>
  <div class="stage" id="stage"><div id="yt"></div><div class="disc" id="disc"></div></div>
  <button class="play" id="pl" disabled>Loading...</button>
  <div class="row"><button class="ghost" id="back">-10s</button><button class="ghost" id="skip">+15s</button></div>
  <div class="bar"><i id="pb"></i></div>
  <div class="status" id="st"></div>
  <button class="reveal" id="rv">Reveal answer</button>
  <div class="ans" id="ans"><div class="y">${year}</div><div class="a"></div><div class="t"></div>
  <a target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${vid}">Watch on YouTube</a></div>
  <div class="row"><button class="ghost" id="nx">Next card</button></div>`;
  const $=id=>document.getElementById(id);
  const ans=$('ans'), pl=$('pl'), st=$('st'), disc=$('disc'), pb=$('pb'), stage=$('stage');
  ans.querySelector('.a').textContent=artist; ans.querySelector('.t').textContent=title;
  let mode='yt', player=null, ready=false;
  const spin=on=>disc.classList.toggle('spin',on);
  const setBtn=s=>pl.textContent=s;

  function useAudio(){
    if(mode==='audio') return; mode='audio';
    try{player&&player.destroy();}catch(e){}
    $('back').style.display=$('skip').style.display='none';
    setBtn('Loading...'); pl.disabled=true;
    findPreview(artist,title).then(u=>{
      if(!u){setBtn('No song found');st.textContent='Tap Reveal and use the YouTube link';return;}
      au.src=u; pl.disabled=false; setBtn('▶  Play'); st.textContent='30-second clip - no peeking!';
    });
  }
  au.onplay=()=>{spin(true);setBtn('❚❚  Pause')};
  au.onpause=()=>{spin(false);setBtn('▶  Play')};
  au.onended=()=>{spin(false);setBtn('↻  Play again')};

  const fail=setTimeout(()=>{if(!ready) useAudio();},12000);
  loadYT().then(()=>{
    if(mode!=='yt') return;
    player=new YT.Player('yt',{width:200,height:200,videoId:vid,
      playerVars:{playsinline:1,controls:0,disablekb:1,fs:0,rel:0,iv_load_policy:3,modestbranding:1},
      events:{
        onReady:()=>{ready=true;clearTimeout(fail);pl.disabled=false;setBtn('▶  Play');st.textContent='Full song - no peeking!';},
        onStateChange:e=>{
          if(e.data===1){spin(true);setBtn('❚❚  Pause');}
          else if(e.data===2){spin(false);setBtn('▶  Play');}
          else if(e.data===0){spin(false);setBtn('↻  Play again');}
        },
        onError:()=>{clearTimeout(fail);useAudio();}
      }});
  });

  pl.onclick=()=>{
    if(mode==='yt'&&player&&ready){
      const s=player.getPlayerState();
      if(s===1) player.pauseVideo(); else { if(s===0) player.seekTo(0,true); player.playVideo(); }
    } else if(mode==='audio'){
      if(au.paused) au.play().catch(()=>st.textContent='Tap play again'); else au.pause();
    }
  };
  $('skip').onclick=()=>{if(player&&ready) player.seekTo(player.getCurrentTime()+15,true);};
  $('back').onclick=()=>{if(player&&ready) player.seekTo(Math.max(0,player.getCurrentTime()-10),true);};
  setInterval(()=>{
    let c=0,d=0;
    if(mode==='yt'&&player&&ready){c=player.getCurrentTime()||0;d=player.getDuration()||0;}
    else {c=au.currentTime;d=au.duration||0;}
    pb.style.width=(d?c/d*100:0)+'%';
  },500);
  $('rv').onclick=()=>{ans.style.display='block';$('rv').style.display='none';stage.classList.add('shown');};
  $('nx').onclick=()=>{try{player&&player.stopVideo();}catch(e){} au.pause();location.search='';};
}
(n>=1&&n<=SONGS.length)?game(n):home();
</script>
</body>
</html>
