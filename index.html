function jsonp(url){

    ()=>jsonp('https://api.deezer.com/search?limit=10&q='+encodeURIComponent(`artist:"${a}" track:"${core}"`)).then(d=>pick(d.data||[],core,x=>x.title,x=>x.preview)?.preview),
    ()=>jsonp('https://api.deezer.com/search?limit=15&q='+encodeURIComponent(`${a} ${core}`)).then(d=>pick(d.data||[],core,x=>x.title,x=>x.preview)?.preview),
    ()=>jsonp('https://itunes.apple.com/search?entity=song&limit=15&term='+encodeURIComponent(`${a} ${core}`)).then(d=>pick(d.results||[],core,x=>x.trackName,x=>x.previewUrl)?.previewUrl),
  ];
  for(const f of tries){try{const u=await f(); if(u) return u;}catch(e){}}
  return null;
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}

const spin=on=>{ if(game==='music') disc.classList.toggle('spin',on); };
const setBtn=s=>pl.textContent=s;
const PLAY='▶  Play', PAUSE='❚❚  Pause', AGAIN='↻  Play again';
const OKMSG=()=>game==='movies'?'30 seconds of the trailer - no peeking at the title!':'Full song - no peeking!';

// ---------- game choice ----------
function setGame(g){
  game=g; document.body.classList.toggle('movies',g==='movies');
  stage.classList.toggle('movie',g==='movies');
  $('modeLbl').textContent=g==='movies'?'🎬  MOVIES - IMDb TOP ENGLISH FILMS':'🎵  MUSIC';
  $('howto').innerHTML=g==='movies'
    ? '<b>How to play:</b> tap Scan, point the camera at a movie card and 30 seconds from the middle of the trailer plays. Guess the year, place it on your timeline, then tap Reveal.'
    : '<b>How to play:</b> tap Scan, point the camera at a card and the song starts. Listen without peeking, place it on your timeline, then tap Reveal.';
}
function showHome(g){
  setGame(g); stopAll(); cur=0;
  $('pickV').hidden=true; $('cardV').hidden=true; $('homeV').hidden=false;
  try{history.replaceState(null,'','?g='+(g==='movies'?'movies':'music'));}catch(e){}
}
function showPick(){
  stopAll(); cur=0;
  $('homeV').hidden=true; $('cardV').hidden=true; $('pickV').hidden=false;
  document.body.classList.remove('movies');
  try{history.replaceState(null,'','?');}catch(e){}
}
function stopAll(){ try{player&&ready&&player.stopVideo();}catch(e){} au.pause(); clearTimeout(autoTimer); }
$('pickMusic').onclick=()=>{unlock();showHome('music');};
$('pickMovies').onclick=()=>{unlock();showHome('movies');};
$('switch1').onclick=showPick; $('switch2').onclick=showPick;

// ---------- YouTube player (one player for the whole session) ----------
window.onYouTubeIframeAPIReady=()=>{
  player=new YT.Player('yt',{width:200,height:200,
    playerVars:{playsinline:1,controls:0,disablekb:1,fs:0,rel:0,iv_load_policy:3,modestbranding:1},
    events:{
      onReady:()=>{ready=true; if(pending){const p=pending;pending=null;startCard(p.n,p.auto);} },
      onStateChange:e=>{
        if(unlocking){ if(e.data===1){player.pauseVideo();player.unMute();unlocking=false;} return; }
        if(!cur||mode!=='yt') return;
        if(e.data===1){spin(true);setBtn(PAUSE);st.textContent=OKMSG();clearTimeout(autoTimer);stage.classList.add('live');}
        else if(e.data===2){spin(false);setBtn(PLAY);}
        else if(e.data===0){spin(false);setBtn(AGAIN);}
      },
      onError:()=>{ if(unlocking){unlocking=false;return;} if(!cur) return;
        if(game==='music') useAudio(); else { setBtn('Trailer unavailable'); pl.disabled=true; st.textContent='Tap Reveal and use the YouTube link'; } }
    }});
};
loadScript('https://www.youtube.com/iframe_api').catch(()=>{});
setTimeout(()=>{ if(!ready && pending && game==='music'){const p=pending;pending=null;cur=p.n;useAudio();} },12000);

// Called from a tap: lets later songs start by themselves
function unlock(){
  if(unlocked) return; unlocked=true;
  try{ au.src=SILENT; au.play().then(()=>au.pause()).catch(()=>{}); }catch(e){}
  if(ready && !cur){ unlocking=true; player.mute(); player.loadVideoById(YT_IDS[0]); }
}

function useAudio(){
  mode='audio'; clearTimeout(autoTimer);
  try{player&&player.stopVideo();}catch(e){}
  $('seek').hidden=true; setBtn('Loading...'); pl.disabled=true;
  const n=cur, [artist,title]=SONGS[n-1];
  findPreview(artist,title).then(u=>{
    if(n!==cur) return;
    if(!u){setBtn('No song found');st.textContent='Tap Reveal and use the YouTube link';return;}
    au.src=u; pl.disabled=false; setBtn(PLAY); st.textContent='30-second clip - no peeking!';
    if(wantAuto) au.play().catch(()=>{st.textContent='Tap Play to start';});
  });
}
au.onplay=()=>{ if(mode==='audio'){spin(true);setBtn(PAUSE);} };
au.onpause=()=>{ if(mode==='audio'){spin(false);setBtn(PLAY);} };
au.onended=()=>{ if(mode==='audio'){spin(false);setBtn(AGAIN);} };

function showCard(g, n, auto){
  setGame(g);
  cur=n; wantAuto=auto; mode='yt';
  try{history.replaceState(null,'','?'+(g==='movies'?'m':'c')+'='+n);}catch(e){}
  document.title='Noot vir Noot - '+(g==='movies'?'movie ':'card ')+n;
  $('pickV').hidden=true; $('homeV').hidden=true; $('cardV').hidden=false;
  $('num').textContent=(g==='movies'?'MOVIE #':'CARD #')+String(n).padStart(3,'0');
  let vid;
  if(g==='movies'){
    const [title,year,rank,id,len]=MOVIES[n-1]; vid=id;
    $('ay').textContent=year; $('aa').textContent=title; $('at').textContent='IMDb Top 250: #'+rank;
    clipS=Math.max(0,Math.floor(len/2)-15); clipE=Math.min(len,clipS+30);
    $('alink').textContent='Watch the full trailer on YouTube';
  } else {
    const [artist,title,year]=SONGS[n-1]; vid=YT_IDS[n-1];
    $('ay').textContent=year; $('aa').textContent=artist; $('at').textContent=title;
    $('alink').textContent='Open on YouTube';
  }
  $('alink').href='https://www.youtube.com/watch?v='+vid;
  ans.style.display='none'; $('rv').style.display=''; stage.classList.remove('shown','live');
  $('seek').hidden=(g==='movies'); disc.classList.remove('spin'); pb.style.width='0';
  au.pause(); au.removeAttribute('src');
  pl.disabled=true; setBtn('Loading...'); st.textContent='';
  if(!ready){ pending={n,auto}; return; }
  startCard(n,auto);
}
function startCard(n,auto){
  if(n!==cur) return;
  unlocking=false; try{player.unMute();}catch(e){}
  pl.disabled=false; setBtn(PLAY); st.textContent=OKMSG();
  clearTimeout(autoTimer);
  const opts = game==='movies' ? {videoId:MOVIES[n-1][3], startSeconds:clipS, endSeconds:clipE} : {videoId:YT_IDS[n-1]};
  if(auto){
    player.loadVideoById(opts);
    autoTimer=setTimeout(()=>{ if(mode==='yt' && player.getPlayerState()!==1){ st.textContent='Tap Play to start'; setBtn(PLAY); spin(false);} },3500);
  } else player.cueVideoById(opts);
}

pl.onclick=()=>{
  unlock();
  if(mode==='yt'&&player&&ready){
    const s=player.getPlayerState();
    if(s===1) player.pauseVideo();
    else if(s===0 && game==='movies'){ player.loadVideoById({videoId:MOVIES[cur-1][3], startSeconds:clipS, endSeconds:clipE}); }
    else { if(s===0) player.seekTo(0,true); player.playVideo(); }
  } else if(mode==='audio' && au.src){
    if(au.paused) au.play().catch(()=>st.textContent='Tap play again'); else au.pause();
  }
};
$('skip').onclick=()=>{if(player&&ready) player.seekTo(player.getCurrentTime()+15,true);};
$('back').onclick=()=>{if(player&&ready) player.seekTo(Math.max(0,player.getCurrentTime()-10),true);};
setInterval(()=>{
  if(!cur) return;
  let p=0;
  if(mode==='yt'&&player&&ready&&player.getCurrentTime){
    const c=player.getCurrentTime()||0;
    if(game==='movies') p=(c-clipS)/((clipE-clipS)||30);
    else { const d=player.getDuration()||0; p=d?c/d:0; }
  } else { p=au.duration?au.currentTime/au.duration:0; }
  pb.style.width=Math.max(0,Math.min(1,p))*100+'%';
},500);
$('rv').onclick=()=>{ans.style.display='block';$('rv').style.display='none';stage.classList.add('shown');};
$('go').onclick=()=>{unlock(); const v=parseInt($('cn').value,10); const max=game==='movies'?MOVIES.length:SONGS.length; if(v>=1&&v<=max) showCard(game,v,true);};
$('cn').onkeydown=e=>{if(e.key==='Enter')$('go').click();};

// ---------- QR scanner ----------
let stream=null, scanning=false, detector=null, cvs=null;
async function openScanner(){
  unlock();
  try{player&&ready&&player.pauseVideo();}catch(e){} au.pause();
  $('scanV').hidden=false; $('scanMsg').textContent="Point the camera at a card's QR code";
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  }catch(e){ $('scanMsg').textContent='Camera not available. Allow camera access for this page, or tap Cancel and type the card number.'; return; }
  const v=$('cam'); v.srcObject=stream; try{await v.play();}catch(e){}
  if(!detector && 'BarcodeDetector' in window){ try{ detector=new BarcodeDetector({formats:['qr_code']}); }catch(e){ detector=null; } }
  if(!detector && !window.jsQR){ try{ await loadScript('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'); }catch(e){} }
  scanning=true; scanLoop();
}
function closeScanner(){
  scanning=false;
  if(stream){stream.getTracks().forEach(t=>t.stop()); stream=null;}
  $('cam').srcObject=null; $('scanV').hidden=true;
}
function cardFrom(text){
  try{
    const u=new URL(text, location.href);
    const m=parseInt(u.searchParams.get('m'),10); if(m>=1&&m<=MOVIES.length) return ['movies',m];
    const c=parseInt(u.searchParams.get('c'),10); if(c>=1&&c<=SONGS.length) return ['music',c];
  }catch(e){}
  const n=parseInt(text,10); const max=game==='movies'?MOVIES.length:SONGS.length;
  return (n>=1&&n<=max)?[game,n]:null;
}
async function scanLoop(){
  if(!scanning) return;
  const v=$('cam'); let text=null;
  if(v.readyState>=2){
    try{
      if(detector){ const codes=await detector.detect(v); if(codes.length) text=codes[0].rawValue; }
      else if(window.jsQR){
        cvs=cvs||document.createElement('canvas');
        const w=v.videoWidth, h=v.videoHeight, s=Math.min(1, 640/Math.max(w,h));
        cvs.width=Math.round(w*s); cvs.height=Math.round(h*s);
        const ctx=cvs.getContext('2d',{willReadFrequently:true}); ctx.drawImage(v,0,0,cvs.width,cvs.height);
        const r=jsQR(ctx.getImageData(0,0,cvs.width,cvs.height).data,cvs.width,cvs.height,{inversionAttempts:'dontInvert'});
        if(r) text=r.data;
      }
    }catch(e){}
  }
  if(text){ const r=cardFrom(text); if(r){ closeScanner(); showCard(r[0],r[1],true); return; } else $('scanMsg').textContent='That is not a Noot vir Noot card'; }
  setTimeout(scanLoop,150);
}
$('scanHome').onclick=openScanner;
$('scanNext').onclick=openScanner;
$('cancel').onclick=closeScanner;

// ---------- start ----------
const q=new URLSearchParams(location.search);
const qm=parseInt(q.get('m'),10), qc=parseInt(q.get('c')||location.hash.slice(1),10);
if(qm>=1&&qm<=MOVIES.length) showCard('movies',qm,true);
else if(qc>=1&&qc<=SONGS.length) showCard('music',qc,true);
else if(q.get('g')==='movies') showHome('movies');
else if(q.get('g')==='music') showHome('music');
</script>
